# agent-runtime sin clonar el repo: usa la imagen única publicada en ghcr.io.
# Configurá DATABASE_URL y RUNTIME_CONFIG_ENCRYPTION_KEY en .env.
name: agent-runtime
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: memory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d memory"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Tarea efímera para aplicar migraciones antes de iniciar la aplicación.
  migrate:
    image: ghcr.io/lucianomocchegiani/agent-runtime:${AGENT_RUNTIME_VERSION:-latest}
    command: ["npm", "run", "prisma:deploy", "-w", "packages/memory"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://agent:agent@postgres:5432/memory?schema=public

  agent-runtime:
    image: ghcr.io/lucianomocchegiani/agent-runtime:${AGENT_RUNTIME_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: ./.env
    environment:
      - DATABASE_URL=postgresql://agent:agent@postgres:5432/memory?schema=public

volumes:
  pgdata:
