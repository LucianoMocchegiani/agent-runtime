global
  log stdout format raw local0
  maxconn 4096

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 1h
  timeout server 1h
  timeout tunnel 1h

resolvers docker
  nameserver embedded 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

frontend runtime_http
  bind :3030
  default_backend runtime_api

backend runtime_api
  option httpchk GET /health
  http-check expect status 200
  server-template api 10 agent-runtime:3030 check resolvers docker init-addr libc,none
