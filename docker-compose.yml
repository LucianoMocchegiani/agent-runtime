# agent-runtime completo: PostgreSQL + aplicación Runtime (API, Memory interno y UI).
#   docker compose up -d --build   →   http://localhost:3010
name: agent-runtime

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: memory
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d memory"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Tarea efímera de despliegue: aplica migraciones antes de iniciar la aplicación.
  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://agent:agent@postgres:5432/memory?schema=public

  # Único servicio de aplicación: HTTP API + módulo Memory en el mismo proceso.
  agent-runtime:
    build:
      context: .
      target: api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: ./.env
    environment:
      - DATABASE_URL=postgresql://agent:agent@postgres:5432/memory?schema=public

volumes:
  pgdata:
