# agent-runtime completo: Postgres + Memory MCP + API con UI nativa.
#   docker compose up -d --build   →   http://localhost:3010

# Fijo: el volumen `agent-runtime_pgdata` no depende del nombre de la carpeta.
name: agent-runtime

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: memory
    # 5433 en el host: el 5432 suele estar tomado por un Postgres nativo.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Memory MCP default: único dueño de la database `memory`. Sin auth propia, solo red interna.
  memory-mcp:
    build:
      context: .
      target: memory-mcp
    restart: unless-stopped
    # Descomentar solo para correr la API en el host contra este contenedor.
    # ports:
    #   - "3012:3012"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://agent:agent@postgres:5432/memory?schema=public
      - MEMORY_MCP_PORT=3012
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3012/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # API + UI nativa en http://localhost:3010 (UI_ENABLED=false en .env la apaga).
  agent-runtime:
    build:
      context: .
      target: api
    restart: unless-stopped
    # Solo esta máquina: la UI no pide login y los MCP conectados (ej. tu PC) quedarían expuestos a la red.
    ports:
      - "127.0.0.1:3010:3010"
    # MCPs que corren en el host (fuera de Docker): http://host.docker.internal:<puerto>/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      memory-mcp:
        condition: service_healthy
    env_file: ./.env
    environment:
      - MEMORY_MCP_URL=http://memory-mcp:3012/mcp

volumes:
  pgdata:
